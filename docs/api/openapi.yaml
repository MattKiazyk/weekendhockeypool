          anyOf:
            - type: string
              format: email
            - type: 'null'
        verified:
          type: boolean
        preferences:
          $ref: '#/components/schemas/EmailPreferences'
      required:
        - email
        - verified
        - preferences
    DeviceKey:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        rotatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        revokedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - label
        - createdAt
        - rotatedAt
        - revokedAt
    DeviceKeys:
      type: object
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/DeviceKey'
      required:
        - keys
    DeviceKeyResponse:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/DeviceKey'
      required:
        - key
    DeviceKeySecret:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/DeviceKey'
        secret:
          type: string
          pattern: ^wpk_[a-f0-9]{64}$
          description: Returned once. Store in platform secure storage. Never log or embed in an app.
      required:
        - key
        - secret
    CreateKey:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before saving; whitespace-only labels are rejected.
      required:
        - label
    EmptyBody:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    Approval:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
        approved:
          type: boolean
        implicit:
          type: boolean
        approvedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        revokedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - userId
        - approved
        - implicit
        - approvedAt
        - revokedAt
    Approvals:
      type: object
      additionalProperties: false
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
      required:
        - approvals
    ApprovalResult:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
        approved:
          type: boolean
      required:
        - userId
        - approved
    Revoked:
      type: object
      additionalProperties: false
      properties:
        revoked:
          const: true
      required:
        - revoked
  responses:
    ApiError:
      description: Request rejected or temporarily unavailable
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/Authenticate'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    NoStore:
      schema:
        const: no-store
      description: Responses must not be cached.
    NoSniff:
      schema:
        const: nosniff
    RequestId:
      schema:
        type: string
        format: uuid
    Authenticate:
      schema:
        type: string
      description: Bearer or ApiKey challenge on 401 responses.
    RetryAfter:
      schema:
        type: string
      description: 60 on application rate-limit rejections (429).
    Allow:
      schema:
        type: string
      description: Allowed methods on 405 responses.
