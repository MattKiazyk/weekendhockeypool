        - reminder
        - recap
    EmailPreferences:
      description: All six switches initially default on. Saved opt-outs persist across sign-ins.
      type: object
      additionalProperties: false
      properties:
        nhl:
          $ref: '#/components/schemas/EmailSwitches'
        pwhl:
          $ref: '#/components/schemas/EmailSwitches'
        nfl:
          $ref: '#/components/schemas/EmailSwitches'
      required:
        - nhl
        - pwhl
        - nfl
    EmailSettings:
      type: object
      additionalProperties: false
      properties:
