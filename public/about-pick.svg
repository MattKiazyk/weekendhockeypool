<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title">
  <title id="title">Choose one winner from the away and home teams</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#182b46"/><stop offset="1" stop-color="#0b1627"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#276ac2"/><stop offset="1" stop-color="#173d72"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6da7f4" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <path d="M0 281H640M126 0V360M514 0V360" stroke="#75a7e6" stroke-opacity=".13" stroke-width="2"/>
  <text x="32" y="51" fill="#8fb7e9" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">01 / PICK A WINNER</text>
  <rect x="35" y="91" width="244" height="196" rx="6" fill="url(#blue)" stroke="#61a5ff" stroke-width="3"/>
  <rect x="361" y="91" width="244" height="196" rx="6" fill="#142439" stroke="#395371" stroke-width="2"/>
  <path d="M81 128l40-15 40 15-6 49-34 28-34-28z" fill="#72b3ff"/>
  <path d="M94 138l27-10 27 10-4 33-23 20-23-20z" fill="#173d72"/>
  <path d="M104 157l11 11 23-28" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="483" cy="158" r="45" fill="#1d3350" stroke="#5c7699" stroke-width="3"/>
  <path d="M453 165c19-22 47-22 63 0m-51-17c17-12 30-12 38 0" fill="none" stroke="#9fb8d8" stroke-width="7" stroke-linecap="round"/>
