  <text x="389" y="242" fill="#e0eaf7" font-family="Arial,sans-serif" font-size="23" font-weight="800">HOME</text>
  <text x="320" y="196" fill="#d3e3f8" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" font-weight="900">VS</text>
  <path d="M220 307h200" stroke="#3d597b" stroke-width="2"/>
