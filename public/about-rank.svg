<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title">
  <title id="title">Assign a different confidence number to each game</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172944"/><stop offset="1" stop-color="#0a1424"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f6d365"/><stop offset="1" stop-color="#bd8727"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6da7f4" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <text x="32" y="51" fill="#8fb7e9" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">02 / RANK YOUR CONFIDENCE</text>
  <rect x="48" y="90" width="168" height="188" rx="8" fill="#3d3015" stroke="#e1ae42" stroke-width="3"/>
  <text x="132" y="206" text-anchor="middle" fill="url(#gold)" font-family="Arial,sans-serif" font-size="105" font-weight="900">18</text>
  <text x="132" y="244" text-anchor="middle" fill="#f7cf69" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="3">POINTS</text>
  <path d="M231 185h52m-17-17 17 17-17 17" fill="none" stroke="#7fa6d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial,sans-serif" font-size="31" font-weight="900" text-anchor="middle">
    <rect x="312" y="94" width="80" height="74" rx="5" fill="#1b3b65" stroke="#4782c6"/><text x="352" y="142" fill="#d9eaff">17</text>
    <rect x="406" y="94" width="80" height="74" rx="5" fill="#1b3b65" stroke="#4782c6"/><text x="446" y="142" fill="#d9eaff">16</text>
    <rect x="500" y="94" width="80" height="74" rx="5" fill="#1b3b65" stroke="#4782c6"/><text x="540" y="142" fill="#d9eaff">15</text>
    <rect x="312" y="185" width="80" height="74" rx="5" fill="#1b3b65" stroke="#4782c6"/><text x="352" y="233" fill="#d9eaff">14</text>
    <rect x="406" y="185" width="80" height="74" rx="5" fill="#1b3b65" stroke="#4782c6"/><text x="446" y="233" fill="#d9eaff">13</text>
    <rect x="500" y="185" width="80" height="74" rx="5" fill="#1b3b65" stroke="#4782c6"/><text x="540" y="233" fill="#d9eaff">12</text>
  </g>
  <text x="320" y="326" fill="#9bb6d5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">USE EVERY NUMBER ONCE</text>
</svg>
