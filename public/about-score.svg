<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title">
  <title id="title">A correct pick earns its confidence points on the final leaderboard</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172944"/><stop offset="1" stop-color="#0a1424"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6da7f4" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <text x="32" y="51" fill="#8fb7e9" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">03 / WATCH THE RESULTS</text>
  <rect x="45" y="86" width="550" height="95" rx="6" fill="#0f2036" stroke="#3a587b" stroke-width="2"/>
  <text x="78" y="120" fill="#65d9aa" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">FINAL</text>
  <text x="79" y="158" fill="#f3f8ff" font-family="Arial,sans-serif" font-size="25" font-weight="900">YOUR PICK WON</text>
  <rect x="449" y="103" width="112" height="59" rx="5" fill="#453415" stroke="#e8b947" stroke-width="2"/>
  <text x="505" y="143" text-anchor="middle" fill="#ffcf5b" font-family="Arial,sans-serif" font-size="30" font-weight="900">+18</text>
  <rect x="45" y="206" width="550" height="84" rx="5" fill="#152f50" stroke="#4987d0" stroke-width="2"/>
  <text x="76" y="258" fill="#f6c84c" font-family="Arial,sans-serif" font-size="36" font-weight="900">01</text>
  <text x="153" y="257" fill="#e9f3ff" font-family="Arial,sans-serif" font-size="23" font-weight="800">YOUR USERNAME</text>
  <text x="559" y="257" fill="#fff" text-anchor="end" font-family="Arial,sans-serif" font-size="31" font-weight="900">142</text>
  <text x="320" y="328" fill="#9bb6d5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">POINTS DECIDE THE RANK</text>
</svg>
